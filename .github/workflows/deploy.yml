name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'server/docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/polar

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set-outputs.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed files
        if: github.event_name != 'workflow_dispatch'
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'server/**'
              - '.github/workflows/deploy.yml'

      - name: Set outputs
        id: set-outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=${{ steps.changes.outputs.backend }}" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            RELEASE_VERSION=${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.detect-changes.outputs.backend == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "server/docker-compose.prod.yml,server/init-readonly-user.sql"
          target: "/home/polar/"
          strip_components: 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN,INFISICAL_CLIENT_ID,INFISICAL_CLIENT_SECRET,INFISICAL_PROJECT_ID
          script: |
            set -e
            cd /home/polar

            DC="docker compose -f docker-compose.prod.yml"

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull secrets from Infisical REST API (no CLI dependency)
            INFISICAL_TOKEN=$(curl -sf -X POST https://app.infisical.com/api/v1/auth/universal-auth/login \
              -H "Content-Type: application/json" \
              -d "{\"clientId\":\"$INFISICAL_CLIENT_ID\",\"clientSecret\":\"$INFISICAL_CLIENT_SECRET\"}" \
              | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)
            curl -sf "https://app.infisical.com/api/v3/secrets/raw?environment=prod&workspaceId=${INFISICAL_PROJECT_ID}&secretPath=/" \
              -H "Authorization: Bearer $INFISICAL_TOKEN" \
              | python3 -c "
import sys, json
data = json.load(sys.stdin)
for s in data.get('secrets', []):
    k, v = s['secretKey'], s['secretValue']
    print(f'{k}={v}')
" > .env
            [ -s .env ] || { echo 'ERROR: .env is empty — secrets not loaded from Infisical'; exit 1; }

            $DC pull api worker

            $DC run --rm api uv run task db_migrate

            $DC up -d --no-deps api worker btc-daemon

            for i in $(seq 1 12); do
              sleep 5
              unhealthy=$($DC ps --format json | jq -r 'select(.Health != "healthy" and .Health != "") | .Service' 2>/dev/null || true)
              [ -z "$unhealthy" ] && break
            done
            $DC ps

            docker image prune -af --filter "until=168h"

            echo "Deployment complete!"

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()
    steps:
      - name: Notify
        run: echo "Deployment failed — check workflow logs."
