services:
  redis:
    image: redis:alpine
    ports:
      - "${POLAR_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 10s
      retries: 10

  db:
    image: postgres:15.1-bullseye
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      - POSTGRES_USER=${POLAR_POSTGRES_USER}
      - POSTGRES_PASSWORD=${POLAR_POSTGRES_PWD}
      - POSTGRES_DB=${POLAR_POSTGRES_DATABASE}
      - POSTGRES_PORT=${POLAR_POSTGRES_PORT:-5432}
      - POLAR_READ_USER=${POLAR_POSTGRES_READ_USER:-polar_read}
      - POLAR_READ_PASSWORD=${POLAR_POSTGRES_READ_PWD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./init-readonly-user.sql:/docker-entrypoint-initdb.d/init-readonly-user.sql
    ports:
      - "${POLAR_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-q",
          "-d",
          "${POLAR_POSTGRES_DATABASE}",
          "-U",
          "${POLAR_POSTGRES_USER}",
        ]
      timeout: 40s
      interval: 2s
      retries: 20

  tinybird:
    image: tinybirdco/tinybird-local:latest
    platform: linux/amd64
    ports:
      - "${TINYBIRD_PORT:-7181}:7181"
      - "${TINYBIRD_ADMIN_PORT:-7182}:7182"
    volumes:
      - ./tinybird:/tinybird:ro
      - ../dev/docker/scripts/tinybird-setup.sh:/scripts/tinybird-setup.sh:ro
    command: ["bash", "/scripts/tinybird-setup.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7181/"]
      interval: 5s
      timeout: 10s
      retries: 30
    profiles:
      - tinybird

  btc-daemon:
    image: bitcartcc/bitcart-btc:stable
    restart: unless-stopped
    environment:
      - BTC_NETWORK=${POLAR_CRYPTO_BTC_NETWORK:-testnet}
      - BTC_XPUB=${POLAR_CRYPTO_BTC_XPUB:-}
      - BTC_LOGIN=${POLAR_CRYPTO_DAEMON_RPC_USER:-polaruser}
      - BTC_PASSWORD=${POLAR_CRYPTO_DAEMON_RPC_PASS:-polarpass}
    ports:
      - "${POLAR_CRYPTO_BTC_DAEMON_PORT:-5000}:5000"
    volumes:
      - btc_daemon_data:/root/.electrum
    profiles:
      - crypto

  eth-daemon:
    image: bitcartcc/bitcart-eth:stable
    restart: unless-stopped
    environment:
      - ETH_XPUB=${POLAR_CRYPTO_ETH_XPUB:-}
      - ETH_LOGIN=${POLAR_CRYPTO_DAEMON_RPC_USER:-polaruser}
      - ETH_PASSWORD=${POLAR_CRYPTO_DAEMON_RPC_PASS:-polarpass}
      - ETH_NETWORK=${POLAR_CRYPTO_ETH_NETWORK:-goerli}
    ports:
      - "${POLAR_CRYPTO_ETH_DAEMON_PORT:-5001}:5000"
    volumes:
      - eth_daemon_data:/root/.ethereum
    profiles:
      - crypto

  ltc-daemon:
    image: bitcartcc/bitcart-ltc:stable
    restart: unless-stopped
    environment:
      - LTC_XPUB=${POLAR_CRYPTO_LTC_XPUB:-}
      - LTC_LOGIN=${POLAR_CRYPTO_DAEMON_RPC_USER:-polaruser}
      - LTC_PASSWORD=${POLAR_CRYPTO_DAEMON_RPC_PASS:-polarpass}
    ports:
      - "${POLAR_CRYPTO_LTC_DAEMON_PORT:-5002}:5000"
    volumes:
      - ltc_daemon_data:/root/.electrum-ltc
    profiles:
      - crypto

volumes:
  postgres_data:
  btc_daemon_data:
  eth_daemon_data:
  ltc_daemon_data:
